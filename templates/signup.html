<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIX - Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #fffef5 0%, #fff2f6 40%, #ebf8ff 70%, #ffffff 100%); }
        .luxury-transparent { background: rgba(255,255,255,.45); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 8px 32px rgba(31,38,135,.04); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800 antialiased p-4">
    <div></div>
    <main class="w-full flex flex-col items-center justify-center my-auto">
        <div class="text-center mb-4"><span class="text-xl font-bold tracking-widest text-black">OMNIX</span></div>
        <div class="w-full max-w-[300px] luxury-transparent rounded-2xl p-5">
            <form id="signupForm" class="space-y-3">
                <input type="text" id="username" required placeholder="Username" class="w-full bg-white/90 border border-gray-200 rounded-xl px-3 py-2 text-xs text-black focus:outline-none focus:border-blue-400">
                <input type="email" id="email" required placeholder="Email Address" class="w-full bg-white/90 border border-gray-200 rounded-xl px-3 py-2 text-xs text-black focus:outline-none focus:border-blue-400">
                <input type="password" id="password" required placeholder="Password" autocomplete="new-password" class="w-full bg-white/90 border border-gray-200 rounded-xl px-3 py-2 text-xs text-black focus:outline-none focus:border-blue-400">

                <label class="flex items-start gap-2 text-[10px] leading-relaxed text-gray-600">
                    <input type="checkbox" id="legalAccepted" required class="mt-0.5 shrink-0">
                    <span>I agree to the <a href="/terms" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline">Terms &amp; Conditions</a> and <a href="/privacy" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline">Privacy Policy</a>.</span>
                </label>

                <button id="signupButton" type="submit" disabled class="w-full bg-black text-white font-medium rounded-xl py-2 text-xs transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    Sign Up
                </button>

                <div class="relative flex py-0.5 items-center"><div class="flex-grow border-t border-gray-200"></div><span class="flex-shrink mx-2 text-[9px] text-gray-400 uppercase">or</span><div class="flex-grow border-t border-gray-200"></div></div>
                <button type="button" onclick="window.location.href='/api/auth/google'" class="w-full bg-white border border-gray-200 text-gray-700 font-medium rounded-xl py-2 text-xs flex items-center justify-center gap-2 hover:bg-gray-50 transition-all cursor-pointer shadow-sm">Continue with Google</button>
            </form>

            <div class="mt-3.5 flex justify-between items-center text-[10px]">
                <a href="/forgot-password" class="text-blue-600 hover:underline">Forgot password?</a>
                <a href="/" class="text-blue-600 font-medium hover:underline">Log In</a>
            </div>
            <div id="errorMessage" class="mt-2 text-center text-[10px] text-red-500 font-medium hidden"></div>
            <div id="successMessage" class="mt-2 text-center text-[10px] text-green-600 font-medium hidden"></div>
        </div>
    </main>
    <footer class="w-full max-w-xs mx-auto text-center space-y-1 text-[9px] text-gray-400 pb-2">
        <div class="flex justify-center space-x-3 text-gray-400"><a href="/terms" class="hover:text-gray-600">Terms of Service</a><a href="/privacy" class="hover:text-gray-600">Privacy Policy</a></div>
    </footer>
    <script>
        const form = document.getElementById('signupForm');
        const legal = document.getElementById('legalAccepted');
        const button = document.getElementById('signupButton');
        const syncConsent = () => { button.disabled = !legal.checked; };
        legal.addEventListener('change', syncConsent);
        syncConsent();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errDiv.classList.add('hidden'); successDiv.classList.add('hidden');
            if (!legal.checked) { errDiv.innerText = 'You must accept the Terms & Conditions and Privacy Policy.'; errDiv.classList.remove('hidden'); return; }
            if (username.length < 3) { errDiv.innerText = 'Username must be at least 3 characters'; errDiv.classList.remove('hidden'); return; }
            if (password.length < 6) { errDiv.innerText = 'Password must be at least 6 characters'; errDiv.classList.remove('hidden'); return; }
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, first_name: username, last_name: '', mobile: '', legal_accepted: true })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    successDiv.innerText = 'Account created! Check your email for verification.'; successDiv.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    errDiv.innerText = data.detail || data.message || 'Sign up failed. Please try again.'; errDiv.classList.remove('hidden'); button.disabled = false;
                }
            } catch { errDiv.innerText = 'Connection error. Please try again.'; errDiv.classList.remove('hidden'); button.disabled = false; }
        });
    </script>
</body>
</html>
