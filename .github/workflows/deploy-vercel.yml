name: Production Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 59.17.0
    steps:
      - name: Checkout exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify required Vercel configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel production environment
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify configured backend health before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.production.local
          BACKEND_URL="$(grep '^VITE_API_BASE_URL=' .env.production.local | cut -d= -f2- | tr -d '\"' | tr -d '\r')"
          test -n "$BACKEND_URL"
          case "$BACKEND_URL" in
            http://localhost*|http://127.0.0.1*|http://0.0.0.0*) echo 'Production VITE_API_BASE_URL points to a local address.'; exit 1;;
            http://*) echo 'Production backend must use HTTPS.'; exit 1;;
          esac
          curl --fail --silent --show-error --max-time 15 "$BACKEND_URL/api/health" >/dev/null

      - name: Install frontend dependencies
        run: npm ci

      - name: Build staged Vercel production artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy staged production version
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test staged frontend
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /health --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN"

      - name: Promote verified deployment
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify production frontend after promotion
        id: production_health
        run: npx --yes vercel@${VERCEL_CLI_VERSION} curl /health --token="$VERCEL_TOKEN"

      - name: Roll back after failed production health check
        if: ${{ failure() && steps.production_health.outcome == 'failure' }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} rollback --token="$VERCEL_TOKEN"
          npx --yes vercel@${VERCEL_CLI_VERSION} rollback status --token="$VERCEL_TOKEN"
          exit 1
