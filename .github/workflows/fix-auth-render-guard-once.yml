name: Fix auth render guard once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace render-time state update
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AuthContainer.tsx'); s=p.read_text()
          old="  if (screen === 'dashboard' && !authSession) { setScreen('login'); return null; }"
          new="  if (screen === 'dashboard' && !authSession) { return <LaunchSplashScreen />; }"
          if s.count(old)!=1: raise SystemExit('auth render guard not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove runner
        run: |
          git diff --check
          git add src/pages/AuthContainer.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid render-time auth state mutation'
          git rm .github/workflows/fix-auth-render-guard-once.yml
          git commit -m 'chore: remove one-time auth render patcher'
          git push origin main
