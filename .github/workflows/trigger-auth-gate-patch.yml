name: Apply auth gate patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/apply_auth_gate_patch.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AuthContainer.tsx
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'fix: enforce Supabase authentication gate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
