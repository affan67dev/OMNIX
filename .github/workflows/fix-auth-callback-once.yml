name: Fix auth callback closure once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale authSession closure guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AuthContainer.tsx'); s=p.read_text()
          old="    const unsubscribe = subscribeToOpenScreen((payload) => {\n      if (!authSession) { setScreen('login'); return; }\n      setScreen('dashboard');"
          new="    const unsubscribe = subscribeToOpenScreen((payload) => {\n      setScreen('dashboard');"
          if s.count(old)!=1: raise SystemExit('callback guard not found exactly once')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove runner
        run: |
          git diff --check
          git add src/pages/AuthContainer.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid stale auth callback closure'
          git rm .github/workflows/fix-auth-callback-once.yml
          git commit -m 'chore: remove one-time auth callback patcher'
          git push origin main
