name: Apply auth gate once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply surgical gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AuthContainer.tsx'); s=p.read_text()
          def r(a,b,n=1):
              if s.count(a)!=n: raise SystemExit(f'mismatch: {a[:80]!r}')
              return a,b
          changes=[]
          changes.append(r("import React, { useEffect, useState } from 'react';","import React, { useEffect, useState } from 'react';\nimport { supabase } from '../supabase/supabaseClient';"))
          changes.append(r("  const [isBootstrapping, setIsBootstrapping] = useState(true);","  const [isBootstrapping, setIsBootstrapping] = useState(true);\n  const [authSession, setAuthSession] = useState<any>(null);"))
          changes.append(r("        const backendReachable = await probeBackendReachable();\n        setOfflineMode(!backendReachable);\n\n        if (!backendReachable) {\n          setScreen('login');\n          setAuthError('Offline Mode');\n        }\n\n        if (!storedToken) {\n          clearCorruptLocalState();\n          setScreen('login');\n        }\n\n        if (backendReachable && storedToken) {","        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();\n        if (sessionError) throw sessionError;\n        const session = sessionData.session;\n        setAuthSession(session);\n        const backendReachable = await probeBackendReachable();\n        setOfflineMode(!backendReachable);\n        if (session && storedToken) {"))
          changes.append(r("        if (backendReachable && launchPayload?.targetScreen === 'chat') {","        if (session && launchPayload?.targetScreen === 'chat') {"))
          changes.append(r("        } else if (backendReachable && launchPayload?.targetScreen === 'profile') {","        } else if (session && launchPayload?.targetScreen === 'profile') {"))
          changes.append(r("        } else if (backendReachable && launchPayload?.targetScreen === 'settings') {","        } else if (session && launchPayload?.targetScreen === 'settings') {"))
          changes.append(r("        if (backendReachable && pendingPushToken) {","        if (session && backendReachable && pendingPushToken) {"))
          changes.append(r("        setScreen('login');\n        setOfflineMode(true);\n        setAuthError('Offline Mode');","        setScreen('login');\n        setAuthSession(null);\n        setAuthError(error instanceof Error ? error.message : 'Authentication could not be restored. Please log in again.');"))
          changes.append(r("    void bootstrap();\n    const unsubscribe = subscribeToOpenScreen((payload) => {\n      setScreen('dashboard');","    void bootstrap();\n    const { data: authSubscription } = supabase.auth.onAuthStateChange((_event, session) => {\n      setAuthSession(session);\n      if (!session) { setScreen('login'); setActiveTab('home'); }\n    });\n    const unsubscribe = subscribeToOpenScreen((payload) => {\n      if (!authSession) { setScreen('login'); return; }\n      setScreen('dashboard');"))
          changes.append(r("    return () => unsubscribe();\n  }, []);","    return () => { authSubscription.subscription.unsubscribe(); unsubscribe(); };\n  }, []);"))
          changes.append(r("  const resetSession = () => {\n    window.localStorage.removeItem('user');","  const resetSession = () => {\n    void supabase.auth.signOut().catch(() => undefined);\n    window.localStorage.removeItem('user');"))
          changes.append(r("    setScreen('login');\n    setActiveTab('home');","    setAuthSession(null);\n    setScreen('login');\n    setActiveTab('home');"))
          changes.append(r("  if (screen === 'dashboard' && appLocked) {","  if (screen === 'dashboard' && !authSession) { setScreen('login'); return null; }\n\n  if (screen === 'dashboard' && appLocked) {"))
          for a,b in changes: s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Verify diff and commit
        run: |
          git diff --check
          git diff -- src/pages/AuthContainer.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AuthContainer.tsx
          git commit -m 'fix: enforce production Supabase authentication gate'
          git rm .github/workflows/apply-auth-gate-once.yml
          git rm -f scripts/apply_auth_gate_patch.py 2>/dev/null || true
          git commit -m 'chore: remove one-time auth patch runner'
          git push origin main
