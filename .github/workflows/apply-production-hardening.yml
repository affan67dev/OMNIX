name: Apply Production Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic beta hardening
        run: python scripts/beta_hardening.py
      - name: Validate Python syntax
        run: python -m compileall -q main.py backend scripts
      - name: Run backend tests
        run: python -m pytest -q
      - name: Validate frontend build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit hardening changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: production performance and request hardening'
          git push
