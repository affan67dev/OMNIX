name: Apply Production Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic beta hardening
        run: |
          python scripts/beta_hardening_v2.py
          python scripts/beta_hardening_v4.py
          python scripts/beta_hardening_v5.py
          python scripts/beta_hardening_v6.py
          python scripts/beta_hardening_v7.py
      - name: Validate Python syntax
        run: python -m compileall -q main.py backend scripts
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run backend tests
        run: python -m pytest -q
      - name: Validate frontend build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Remove stale broken gitlink
        run: git rm -r --cached --ignore-unmatch .buildozer/android/platform/python-for-android || true
      - name: Commit hardening changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: persist Supabase stories and storage integration'
          git push
      - name: Verify clean working tree
        run: |
          git status --short
          test -z "$(git status --porcelain)"
