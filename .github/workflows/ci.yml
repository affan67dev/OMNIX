name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      OTP_PEPPER: ci-only-otp-pepper-012345678901234567890123456789
      ADMIN_API_KEY: ci-only-admin-key-012345678901234567890123456789
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-only-anon-key
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Python syntax validation
        run: python -m compileall -q main.py backend scripts

      - name: Backend tests
        run: npm test

      - name: Backend startup and health validation
        run: npm run validate:backend

      - name: Production environment contract validation
        run: npm run validate:env

      - name: Production frontend build
        run: npm run build

      - name: Verify no accidental secrets or local databases are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.db$|.*\.sqlite3?$|.*\.jks$|.*\.keystore$|google-services\.json$|api-credentials\.json$)' ; then
            echo 'Tracked credential/database artifact detected.'
            exit 1
          fi

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnix-web-${{ github.sha }}
          path: dist
          if-no-files-found: error

  main-gate:
    name: Main branch release gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI gate passed for $GITHUB_SHA; deployment may proceed."

# Release verification trigger: keep CI behavior unchanged.
