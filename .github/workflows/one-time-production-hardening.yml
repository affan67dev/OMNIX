name: One-time production hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch FastAPI guard and remove dead local state
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main.py')
          text = p.read_text()

          old = 'limiter = Limiter(key_func=get_remote_address)'
          new = '''limiter = Limiter(\n    key_func=get_remote_address,\n    default_limits=[os.getenv("GLOBAL_RATE_LIMIT", "120/minute")],\n    storage_uri=os.getenv("RATE_LIMIT_STORAGE_URI", "memory://"),\n    headers_enabled=True,\n)'''
          if old in text:
              text = text.replace(old, new, 1)

          old = 'import secrets\nfrom slowapi'
          new = 'import secrets\nimport logging\nfrom slowapi'
          if old in text and 'import logging' not in text:
              text = text.replace(old, new, 1)

          text = text.replace('add_admin_log("ERROR", f"Unhandled exception {request_id}: {error}")', 'logging.getLogger("omnix").exception("Unhandled request exception %s", request_id)')

          # Remove unused prototype stores that have no live call sites.
          text = re.sub(r'\nclass ChatConversationStore:\n.*?\n\nchat_store = ChatConversationStore\(\)\n', '\n', text, flags=re.S)
          text = re.sub(r'\nin_memory_posts: List\[dict\] = \[.*?\n\nin_memory_stories: List\[dict\] = \[', '\n', text, count=1, flags=re.S)
          # The post block is only a legacy seed store; restore the story declaration if the regex consumed it.
          if 'in_memory_stories: List[dict]' not in text:
              marker = '\npost_interaction_events: List[dict] = []'
              text = text.replace(marker, '\nin_memory_stories: List[dict] = []\n' + marker, 1)

          # Remove unused prototype event/identity stores and helpers only when their names occur nowhere else.
          text = re.sub(r'\npost_interaction_events: List\[dict\] = \[\]\n', '\n', text)
          text = re.sub(r'\nadmin_logs_state: List\[dict\] = \[.*?\n\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\notp_challenges: Dict\[str, Dict\[str, Any\]\] = \{\}\nauth_identity_registry: Dict\[str, Any\] = \{.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\n\ndef add_admin_log\(.*?\n\ndef normalize_phone', '\n\ndef normalize_phone', text, count=1, flags=re.S)
          text = re.sub(r'\n\ndef refresh_identity_registry\(.*?\n\ndef is_username_conflict_error', '\n\ndef is_username_conflict_error', text, count=1, flags=re.S)

          p.write_text(text)

      - name: Validate syntax
        run: python -m py_compile main.py

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/one-time-production-hardening.yml
          git rm -f .github/workflows/one-time-production-hardening.yml
          git diff --cached --quiet || git commit -m "security: harden global rate limits and remove dead state"
          git push
