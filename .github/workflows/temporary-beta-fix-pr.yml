name: Temporary beta integration patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply surgical patch
        run: python scripts/temporary_beta_fix.py
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AuthContainer.tsx src/utils/socialApi.ts src/pages/ChatScreen.tsx src/components/settings/SettingsHub.tsx .env.example vercel.json public/health.json
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'fix: align auth and production API integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
